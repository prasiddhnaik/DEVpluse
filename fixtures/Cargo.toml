[package]
name = "runscape-fixtures"
description = "Deterministic fixture processes used to verify Runscape discovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fixture-tcp-server"
path = "src/bin/fixture_tcp_server.rs"

[[bin]]
name = "fixture-tcp-client"
path = "src/bin/fixture_tcp_client.rs"

[dependencies]
clap.workspace = true

[dev-dependencies]
runscape-core.workspace = true
runscape-discovery.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

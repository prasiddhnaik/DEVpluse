[workspace]
resolver = "3"
members = [
    "crates/runscape-core",
    "crates/runscape-discovery",
    "crates/runscape-events",
    "crates/runscape-storage",
    "crates/runscape-docker",
    "crates/runscape-server",
    "crates/runscape-cli",
    "fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/prasiddhnaik/DEVpluse"
homepage = "https://github.com/prasiddhnaik/DEVpluse"
publish = false

[workspace.dependencies]
runscape-core = { path = "crates/runscape-core" }
runscape-discovery = { path = "crates/runscape-discovery" }
runscape-events = { path = "crates/runscape-events" }
runscape-storage = { path = "crates/runscape-storage" }
runscape-docker = { path = "crates/runscape-docker" }
runscape-server = { path = "crates/runscape-server" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bollard = "0.21.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
rust-embed = "8.9.0"
netstat2 = "0.11.2"
regex = "1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sysinfo = "0.39.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.24"
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.29.0"

[profile.release]
lto = "thin"
strip = true

# Debug Runscape stays unoptimized so the daemon is easy to step through.
# These two crates dominate collector CPU in `cargo run`; compiling them
# optimized cuts process/socket snapshot time without a full release build.
[profile.dev.package.sysinfo]
opt-level = 3

[profile.dev.package.netstat2]
opt-level = 3

[package]
name = "runscape-cli"
description = "Runscape CLI: one-shot scans, the daemon, and a headless agent interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "runscape"
path = "src/main.rs"

[dependencies]
runscape-core.workspace = true
runscape-discovery.workspace = true
runscape-server.workspace = true

anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "signal"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
